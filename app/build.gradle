plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.mobileinvoice.ocr'
    compileSdk 35

    defaultConfig {
        applicationId "com.brador.dailyrecord"
        minSdk 26
        targetSdk 35
        versionCode 135
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
        }
    }

    sourceSets {
        main {
            manifest.srcFile '../AndroidManifest.xml'
            assets.srcDirs(['../assets'])
            jniLibs.srcDirs(['../lib'])
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                'META-INF/INDEX.LIST',
                'META-INF/MANIFEST.MF'
            ]
        }
        jniLibs {
            useLegacyPackaging false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// Fix for AGP Windows bug: AAPT2 source annotations contain colons which are
// illegal in Windows paths. Strip "<!-- From: ... -->" comments from merged
// values XML files after merge, before AAPT2 processes them.
afterEvaluate {
    ['Release', 'Debug'].each { variant ->
        def taskName = "merge${variant}Resources"
        def task = tasks.findByName(taskName)
        if (task) {
            task.doLast {
                def mergedDir = file("${buildDir}/intermediates/incremental/${variant.toLowerCase()}/${taskName}/merged.dir")
                if (mergedDir.exists()) {
                    fileTree(mergedDir).matching { include '**/*.xml' }.each { xmlFile ->
                        def content = xmlFile.text
                        def cleaned = content.replaceAll('<!--\\s*From:[^>]*-->', '')
                        if (content != cleaned) {
                            xmlFile.text = cleaned
                        }
                    }
                }
            }
        }
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.emoji2:emoji2:1.5.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    implementation 'androidx.startup:startup-runtime:1.2.0'
    implementation 'androidx.legacy:legacy-support-core-utils:1.0.0'

    // Material Design
    implementation 'com.google.android.material:material:1.12.0'

    // CameraX
    def camerax_version = "1.4.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation "androidx.camera:camera-video:${camerax_version}"

    // Room Database
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:${room_version}"
    annotationProcessor "androidx.room:room-compiler:${room_version}"
    implementation "androidx.room:room-rxjava3:${room_version}"

    // RxJava 3
    implementation 'io.reactivex.rxjava3:rxjava:3.1.9'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'

    // Google ML Kit Text Recognition (bundled)
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // Google Maps & Location
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'

    // ONNX Runtime (for PaddleOCR engine)
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.0'

    // Apache POI (Excel export)
    implementation 'org.apache.poi:poi:5.2.5'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    // Apache Commons
    implementation 'commons-io:commons-io:2.16.1'
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'org.apache.commons:commons-compress:1.26.1'

    // Google HTTP Client
    implementation 'com.google.http-client:google-http-client:1.44.1'
    implementation 'com.google.http-client:google-http-client-gson:1.44.1'

    // Google API Client & Drive
    implementation 'com.google.api-client:google-api-client-android:2.7.0'
    implementation 'com.google.apis:google-api-services-drive:v3-rev20241027-2.0.0'

    // Firebase / datatransport (transitive through ML Kit)
    implementation 'com.google.android.datatransport:transport-runtime:3.3.0'
}
